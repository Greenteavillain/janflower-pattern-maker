<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>잔꽃 패턴 메이커</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Cg transform='translate(10,0)'%3E%3Cpath d='M0,0 L10,0 A10,10 0 0,1 0,10 Z' fill='%23ff92ce' stroke='%23ff92ce' stroke-width='0.294' transform='rotate(270 5 5)'/%3E%3C/g%3E%3Cg transform='translate(20,0)'%3E%3Cpath d='M0,0 L10,0 A10,10 0 0,1 0,10 Z' fill='%23ff92ce' stroke='%23ff92ce' stroke-width='0.294' transform='rotate(180 5 5)'/%3E%3C/g%3E%3Cg transform='translate(10,10)'%3E%3Cpath d='M0,0 L10,0 A10,10 0 0,1 0,10 Z' fill='%23ff92ce' stroke='%23ff92ce' stroke-width='0.294' transform='rotate(270 5 5)'/%3E%3C/g%3E%3Cg transform='translate(20,10)'%3E%3Cpath d='M0,0 L10,0 A10,10 0 0,1 0,10 Z' fill='%23ff92ce' stroke='%23ff92ce' stroke-width='0.294' transform='rotate(180 5 5)'/%3E%3C/g%3E%3Cg transform='translate(10,20)'%3E%3Cpath d='M0,0 L10,0 A10,10 0 0,1 0,10 Z' fill='%23ff92ce' stroke='%23ff92ce' stroke-width='0.294' transform='rotate(90 5 5)'/%3E%3C/g%3E%3Cg transform='translate(20,20)'%3E%3Cpath d='M0,0 L10,0 A10,10 0 0,1 0,10 Z' fill='%23ff92ce' stroke='%23ff92ce' stroke-width='0.294'/%3E%3C/g%3E%3Cg transform='translate(10,30)'%3E%3Cpath d='M0,0 L10,0 A10,10 0 0,1 0,10 Z' fill='%23548962' stroke='%23548962' stroke-width='0.294' transform='rotate(90 5 5)'/%3E%3C/g%3E%3Cg transform='translate(20,30)'%3E%3Cpath d='M0,0 L10,0 A10,10 0 0,1 0,10 Z' fill='%23548962' stroke='%23548962' stroke-width='0.294'/%3E%3C/g%3E%3C/svg%3E">
<style>
  :root{
    --beige:#fff8ee;
    --pink:#ff92ce;
    --yellow:#ffcc66;
    --green:#548962;
    --ink:#3d6249;
    --surface:#fffdf8;                 /* 크롬 표면: 따뜻한 화이트 */
    --hair:rgba(61,75,58,.13);         /* 헤어라인 */
    --hover:rgba(84,137,98,.08);       /* 호버 틴트 */
    --shadow:0 4px 16px rgba(61,75,58,.10);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    margin:0;
    height:100dvh;
    display:flex; flex-direction:column;
    overflow:hidden;
    overscroll-behavior:none;
    background:var(--beige);
    color:var(--ink);
    font-family:"Pretendard Variable", Pretendard, "Apple SD Gothic Neo", "Noto Sans KR", -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
    line-height:1.45;
  }

  /* ───────── 무한 캔버스 무대 ───────── */
  main{
    flex:1 1 auto; min-height:0;
    position:relative;
    display:flex;
  }
  .stage{
    flex:1 1 auto; min-width:0; min-height:0;
    position:relative;
    background:var(--beige);
    overflow:hidden;
  }
  .stage.transparent{
    background:
      repeating-conic-gradient(rgba(84,137,98,.10) 0% 25%, rgba(255,255,255,.4) 0% 50%)
      0 0 / 18px 18px;
  }
  #board{
    position:absolute; inset:0; width:100%; height:100%;
    display:block; touch-action:none; user-select:none;
    -webkit-user-select:none; -webkit-touch-callout:none;
    cursor:crosshair;
  }
  .stage.placingmode #board{cursor:copy;}
  .stage.panmode #board{cursor:grab;}
  .stage.axishover #board{cursor:ew-resize;}
  .stage.panning #board{cursor:grabbing;}

  /* ───────── 공통 컨트롤 ───────── */
  button{
    font-family:inherit; color:var(--ink);
    border:none; background:none; cursor:pointer; padding:0;
    touch-action:manipulation;
  }
  button:focus-visible{outline:2px solid rgba(84,137,98,.7); outline-offset:2px;}
  .ic{width:18px; height:18px; display:block;}

  /* 아이콘 버튼 — 평상시 고스트, 켜짐은 초록 면 */
  .ibtn{
    width:30px; height:30px; border-radius:6px;
    display:flex; align-items:center; justify-content:center;
    transition:background .1s;
  }
  .ibtn:hover{background:var(--hover);}
  .ibtn:active{transform:translateY(1px);}
  .ibtn.on{background:var(--green); color:var(--beige);}
  .ibtn-row{display:flex; align-items:center; gap:2px; flex-wrap:wrap;}
  .vdiv{width:1px; height:18px; background:var(--hair); margin:0 5px; flex:0 0 auto;}

  /* 텍스트 버튼(배율 등) */
  .tbtn{
    border-radius:6px; padding:0 8px; height:30px;
    font-size:12px; font-weight:600;
    display:flex; align-items:center;
  }
  .tbtn:hover{background:var(--hover);}

  /* 메뉴 행 */
  .mrow{
    width:100%; text-align:left;
    border-radius:6px; padding:7px 9px;
    font-size:13px; font-weight:500; letter-spacing:-0.01em;
    display:flex; align-items:center; gap:9px;
  }
  .mrow:hover{background:var(--hover);}
  .mrow .mic{width:15px; height:15px; flex:0 0 auto; opacity:.6;}
  .mrow .kbd{margin-left:auto; font-size:10.5px; opacity:.4; font-weight:500; letter-spacing:0;}

  /* ───────── 떠 있는 표면 공통 ───────── */
  .surface{
    background:var(--surface);
    border:1px solid var(--hair);
    box-shadow:var(--shadow);
  }

  /* 배율 HUD */
  .zoomhud{
    position:absolute; right:14px; bottom:14px; z-index:5;
    border-radius:6px; padding:4px 10px;
    font-size:11.5px; font-weight:700;
  }
  .zoomhud:hover{background:var(--surface); filter:brightness(.98);}

  /* 토스트 알림 */
  .toast{
    position:absolute; left:50%; bottom:72px; transform:translateX(-50%) translateY(6px);
    z-index:8; max-width:calc(100% - 28px);
    border-radius:8px; padding:9px 14px;
    font-size:12.5px; font-weight:600; line-height:1.3; text-align:center;
    background:var(--surface); border:1px solid var(--hair); box-shadow:var(--shadow);
    opacity:0; pointer-events:none;
    transition:opacity .18s ease, transform .18s ease;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .toast.show{opacity:1; transform:translateX(-50%) translateY(0);}
  @media (max-width:760px){ .toast{bottom:16px;} }

  /* 영역 선택 바 (갤러리 업로드) */
  .selbar{
    position:absolute; top:12px; left:50%; transform:translateX(-50%); z-index:7;
    display:none; align-items:center; gap:6px;
    border-radius:8px; padding:4px 4px 4px 12px;
    font-size:12.5px; font-weight:600; white-space:nowrap; max-width:calc(100% - 24px);
  }
  .selbar.visible{display:flex;}
  .selbar .nm{color:var(--green); margin-right:2px;}
  .sbtn{
    background:var(--green); color:var(--beige);
    border-radius:6px; padding:0 12px; height:28px; font-size:12px; font-weight:700;
    display:flex; align-items:center;
  }
  .sbtn:hover{filter:brightness(1.06);}
  .sbtn[hidden]{display:none;}
  @media (max-width:760px){ .selbar{top:56px;} }

  /* 실시간 협업 방 바 */
  .roombar{
    position:absolute; top:12px; left:50%; transform:translateX(-50%); z-index:7;
    display:none; align-items:center; gap:8px;
    border-radius:8px; padding:4px 4px 4px 12px;
    font-size:12.5px; font-weight:700; white-space:nowrap; max-width:calc(100% - 24px);
  }
  .roombar.visible{display:flex;}
  .roombar .rb-me{display:flex; align-items:center; gap:5px; font-size:12.5px; font-weight:700; color:var(--ink); border-radius:6px; padding:2px 5px;}
  .roombar .rb-me:hover{background:var(--hover);}
  .roombar .rb-dot{width:9px; height:9px; border-radius:50%; background:var(--green); flex:0 0 auto;}
  .roombar .rc{color:var(--ink); opacity:.5; font-weight:600;}
  @media (max-width:760px){ .roombar{top:56px;} }

  /* 실시간 채팅창 */
  /* 실시간 채팅 — 평소 숨김, 좌하단 호버나 엔터로 표시. 박스 없이 말풍선이 세로로 연속. */
  .chatbox{
    position:absolute; left:14px; bottom:14px; z-index:7;
    display:none; flex-direction:column; gap:5px; width:240px; max-width:calc(100% - 28px);
  }
  .chatbox.visible{display:flex;}
  .chat-log{
    display:flex; flex-direction:column; gap:5px;
    max-height:46vh; overflow-y:auto; padding-top:2px;
    scrollbar-width:thin; scrollbar-color:var(--hair) transparent;
  }
  .chat-log::-webkit-scrollbar{width:6px;}
  .chat-log::-webkit-scrollbar-thumb{background:var(--hair); border-radius:4px;}
  /* 말풍선: 좌상단 + 우하단만 사분원(반지름=높이 절반), 나머지 직각 (점대칭). 보낸이 색으로 채우고 글자는 흰색 */
  .chat-msg{
    align-self:flex-start; max-width:100%;
    background:var(--green); border:1.3px solid #fff8ee; border-radius:14px 0 14px 0;
    padding:5px 11px; font-size:12px; line-height:1.35; word-break:break-word;
    color:#fff; box-shadow:0 1px 5px rgba(61,98,73,.14);
  }
  @keyframes jfChatIn{ from{ transform:translateY(10px) scale(.96); opacity:0; } to{ transform:translateY(0) scale(1); opacity:1; } }
  .chat-msg.jf-in{ animation:jfChatIn .3s cubic-bezier(.2,.9,.3,1.25) both; }
  .chat-msg .who{font-weight:700; margin-right:5px;}
  .chat-input{
    align-self:stretch; font-family:inherit; font-size:12.5px; color:#fff;
    padding:7px 12px; border:1.3px solid #fff8ee; border-radius:14px 0 14px 0;
    background:var(--green); outline:none; box-shadow:0 1px 5px rgba(61,98,73,.14);
  }
  .chat-input::placeholder{color:#fff; opacity:.7;}
  @media (max-width:760px){ .chatbox{width:200px;} }

  /* 갤러리 오버레이 */
  .gallery-overlay{
    position:absolute; inset:0; z-index:20;
    display:none; align-items:center; justify-content:center;
    background:rgba(61,75,58,.30); padding:20px;
  }
  .gallery-overlay.open{display:flex;}
  .gallery-panel{
    width:min(720px, 100%); max-height:100%;
    display:flex; flex-direction:column; border-radius:12px; overflow:hidden;
  }
  .gallery-head{
    display:flex; align-items:center; justify-content:space-between;
    padding:12px 8px 12px 16px; border-bottom:1px solid var(--hair); flex:0 0 auto;
  }
  .gallery-head .gt{font-size:14px; font-weight:800;}
  .gallery-grid{
    display:grid; grid-template-columns:repeat(auto-fill, minmax(140px,1fr)); gap:12px;
    padding:14px; overflow-y:auto; scrollbar-gutter:stable; flex:1 1 auto;
  }
  .gallery-item{
    position:relative;
    border-radius:8px; padding:8px; cursor:pointer;
    display:flex; flex-direction:column; gap:5px; align-items:center;
    border:1px solid var(--hair); background:var(--beige);
    transition:box-shadow .1s, transform .1s;
  }
  .g-author{font-size:10px; opacity:.5; align-self:stretch; text-align:center; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .g-del{
    position:absolute; top:5px; right:5px; width:22px; height:22px; border-radius:6px;
    display:none; align-items:center; justify-content:center;
    background:var(--surface); border:1px solid var(--hair); color:var(--ink); box-shadow:var(--shadow);
  }
  .g-del svg{width:12px; height:12px; display:block;}
  .g-del:hover{color:#d6539f;}
  .gallery-item:hover .g-del{display:flex;}
  .gallery-item:hover{box-shadow:var(--shadow); transform:translateY(-1px);}
  .gallery-item svg{width:100%; height:auto; display:block;}
  .gallery-item .g-title{
    font-size:11.5px; font-weight:600; text-align:center; line-height:1.25; align-self:stretch;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  }
  .gallery-empty{grid-column:1/-1; padding:48px 20px; text-align:center; opacity:.6; font-size:13px; line-height:1.6;}
  @media (max-width:760px){ .gallery-grid{grid-template-columns:repeat(auto-fill, minmax(104px,1fr)); gap:10px;} }

  /* 모달 다이얼로그 (업로드 등) */
  .modal-overlay{
    position:absolute; inset:0; z-index:22;
    display:none; align-items:center; justify-content:center;
    background:rgba(61,75,58,.30); padding:20px;
  }
  .modal-overlay.open{display:flex;}
  .modal-card{
    width:min(330px, 100%); border-radius:12px; padding:18px;
    display:flex; flex-direction:column; gap:11px;
  }
  .modal-title{font-size:14px; font-weight:700; letter-spacing:-0.01em;}
  .fld{display:flex; flex-direction:column; gap:5px; font-size:11.5px; font-weight:600; opacity:.9;}
  .fld em{font-style:normal; opacity:.5; font-weight:500;}
  .fld input{
    font-family:inherit; font-size:13px; font-weight:500; color:var(--ink);
    padding:8px 10px; border:1px solid var(--hair); border-radius:7px;
    background:var(--beige); outline:none; transition:border-color .1s;
  }
  .fld input:focus{border-color:var(--green);}
  .modal-actions{display:flex; justify-content:flex-end; gap:8px; margin-top:4px;}
  .mbtn{border-radius:7px; padding:7px 15px; font-size:12.5px; font-weight:700;}
  .mbtn.ghost{background:var(--hover); color:var(--ink);}
  .mbtn.ghost:hover{filter:brightness(.97);}
  .mbtn.primary{background:var(--green); color:var(--beige);}
  .mbtn.primary:hover{filter:brightness(1.06);}
  /* 불러오기 방식 선택 옵션 */
  .load-opt{
    display:flex; align-items:center; gap:11px; width:100%; text-align:left;
    padding:11px 12px; border-radius:8px; border:1px solid var(--hair); background:var(--beige);
    transition:background .1s, border-color .1s;
  }
  .load-opt:hover{background:var(--hover); border-color:var(--green);}
  .load-opt.warn:hover{border-color:#e0479e;}
  .load-opt .lo-ic{width:20px; height:20px; flex:0 0 auto; color:var(--green);}
  .load-opt.warn .lo-ic{color:#d6539f;}
  .load-opt .lo-txt{display:flex; flex-direction:column; min-width:0;}
  .load-opt .lo-txt b{font-size:13px; font-weight:700;}
  .load-opt .lo-txt small{font-size:11px; opacity:.6; margin-top:1px;}

  /* 배치 모드 바 */
  .placebar{
    position:absolute; top:12px; left:50%; transform:translateX(-50%); z-index:5;
    display:none; align-items:center; gap:4px;
    border-radius:8px; padding:4px 4px 4px 12px;
    font-size:12.5px; font-weight:600; white-space:nowrap;
    max-width:calc(100% - 24px);
  }
  .placebar.visible{display:flex;}
  .placebar .nm{color:#d6539f; margin-right:4px;}

  /* ───────── 플로팅 패널 공통 ───────── */
  .panel, .library{
    position:absolute; top:58px; z-index:6;
    max-height:calc(100% - 72px);
    overflow-y:auto; overscroll-behavior:contain;
    scrollbar-gutter:stable; scrollbar-width:thin; scrollbar-color:var(--hair) transparent;
    border-radius:10px;
    padding:8px;
    transition:transform .18s ease, opacity .18s ease;
  }
  .panel{right:14px; width:212px;}
  .library{left:14px; width:240px; padding:10px; z-index:8;}   /* 채팅 위로 — 겹치면 라이브러리가 채팅을 덮음 */
  .inroom .library{max-height:calc(100% - 335px);}             /* 협업 중엔 높이 줄여 아래 채팅 7줄 공간 확보 */
  .panel.collapsed{transform:translateX(calc(100% + 22px)); opacity:0; pointer-events:none;}
  .library.collapsed{transform:translateX(calc(-100% - 22px)); opacity:0; pointer-events:none;}
  .panel::-webkit-scrollbar, .library::-webkit-scrollbar{width:11px;}
  .panel::-webkit-scrollbar-track, .library::-webkit-scrollbar-track{background:transparent;}
  .panel::-webkit-scrollbar-thumb, .library::-webkit-scrollbar-thumb{
    background:var(--hair); border-radius:6px;
    border:3px solid transparent; background-clip:padding-box;
  }
  .panel::-webkit-scrollbar-thumb:hover, .library::-webkit-scrollbar-thumb:hover{
    background:rgba(61,75,58,.28); background-clip:padding-box;
  }

  /* 플로팅 토글 버튼 (데스크톱 좌·우 상단) */
  .fab{
    position:absolute; z-index:7;
    width:36px; height:36px; border-radius:8px;
    display:flex; align-items:center; justify-content:center;
  }
  .fab:hover{filter:brightness(.98);}
  .fab:active{transform:scale(.96);}
  .fab.on{background:var(--green); color:var(--beige); border-color:var(--green);}
  #fab{top:14px; right:14px;}
  #gridFab{top:14px; right:58px;}
  #libFab{top:14px; left:14px;}

  /* ───────── 라이브러리 내부 ───────── */
  .cat{
    font-size:10.5px; font-weight:800; letter-spacing:.05em;
    margin:10px 2px 5px; opacity:.55;
  }
  .cat:first-of-type{margin-top:0;}
  .lib-grid{display:grid; grid-template-columns:repeat(3, 1fr); gap:5px;}
  .lib-item{
    border-radius:8px; padding:6px 3px 5px;
    display:flex; flex-direction:column; align-items:center; gap:3px;
    transition:background .1s, box-shadow .1s;
  }
  .lib-item:hover{background:var(--hover);}
  .lib-item.active{box-shadow:inset 0 0 0 1.5px var(--green); background:rgba(84,137,98,.07);}
  .lib-item svg{width:52px; height:52px; display:block; background:var(--beige); border-radius:6px;}
  .lib-item .nm{font-size:10.5px; font-weight:600; line-height:1.2; text-align:center;}

  /* ───────── 도구 패널 내부 ───────── */
  .sec{margin-bottom:8px;}
  .sec:last-child{margin-bottom:0;}
  .divider{border:0; border-top:1px solid var(--hair); margin:8px 2px;}

  .shape-row{display:flex; gap:2px; flex-wrap:wrap;}
  .shape-btn{
    width:38px; height:38px; border-radius:6px; padding:3px;
    display:flex; align-items:center; justify-content:center;
    transition:background .1s;
  }
  .shape-btn svg{display:block;}
  .shape-btn:hover{background:var(--hover);}
  .shape-btn.selected{background:rgba(84,137,98,.16);}

  .color-row{display:flex; gap:8px; padding:2px 3px;}
  .swatch{
    width:26px; height:26px; border-radius:50%;
    border:1px solid rgba(0,0,0,.06);
    transition:box-shadow .1s;
  }
  .swatch.selected{box-shadow:0 0 0 2px var(--surface), 0 0 0 3.5px var(--green);}

  /* 데스크톱 하단 팔레트 바 (피그마식 중앙 플로팅) */
  .dockbar{
    position:absolute; left:50%; transform:translateX(-50%); bottom:14px; z-index:6;
    display:flex; align-items:center; gap:8px;
    border-radius:10px; padding:6px 10px;
  }
  .dockbar .vdiv{margin:0 3px;}

  /* ───────── 모바일 전용 요소 (데스크톱에선 숨김) ───────── */
  .mtoolbar{display:none;}
  .mtop{display:none;}

  /* ───────── 모바일 ───────── */
  @media (max-width:760px){
    main{flex-direction:column;}

    .dockbar{display:none;}

    /* 하단 툴바 — 팔레트 + 실행취소 */
    .mtoolbar{
      display:flex; flex:0 0 auto; align-items:center; gap:8px;
      padding:7px 10px calc(7px + env(safe-area-inset-bottom));
      border-top:1px solid var(--hair);
      background:var(--surface);
    }
    .mtb-scroll{
      flex:1 1 auto; min-width:0;
      display:flex; align-items:center; gap:6px;
      overflow-x:auto; padding:2px;
      -webkit-overflow-scrolling:touch;
    }
    .mtb-scroll::-webkit-scrollbar{display:none;}
    .mtb-div{flex:0 0 1px; height:24px; background:var(--hair);}
    .mtb-fixed{flex:0 0 auto; display:flex; gap:2px; align-items:center;}
    .mtoolbar .shape-row, .mtoolbar .color-row{flex-wrap:nowrap;}
    .mtoolbar .shape-btn{flex:0 0 auto;}
    .mtoolbar .swatch{width:30px; height:30px; flex:0 0 auto;}
    .mtoolbar .ibtn{width:38px; height:38px;}

    /* 상단 우측: 이동·회전·메뉴 — 하나의 바 */
    .mtop{
      position:absolute; top:10px; right:10px; z-index:7;
      display:flex; align-items:center; gap:2px;
      border-radius:10px; padding:3px;
    }
    .mtop .ibtn{width:34px; height:34px;}

<script>
"use strict";

/* ───────────────────────── 상수 & 상태 ───────────────────────── */
const CELL = 60;                       // 월드 좌표계에서 셀 한 변
const COLORS = { p:"#ff92ce", y:"#ffcc66", g:"#548962" };
// 협업(커서·호버·키보드)은 데스크톱 전용 — 터치 기기는 막음(모바일 협업은 추후)
const IS_TOUCH = (window.matchMedia && window.matchMedia("(pointer: coarse)").matches) || ("ontouchstart" in window && !window.matchMedia("(pointer: fine)").matches);
const COLOR_NAMES = { p:"jf pink", y:"jf yellow", g:"jf green" };
const BG = "#fff8ee";

// 회전 의미 — Q(사분원): 부채꼴 중심이 놓이는 모서리 / I(역사분원): 파인 모서리
// 0 = 좌상, 1 = 우상, 2 = 우하, 3 = 좌하  (rotate(90°×rot)로 구현)
const MIRROR_ROT = [1, 0, 3, 2];       // 좌우반전 시 회전값 매핑

const ZMIN = 0.08, ZMAX = 5;           // z = 월드 1단위당 화면 px (z=1 → 셀 60px = 100%)
const GRID_MIN_PX = 14;                // 셀이 이보다 작아지면 격자 자동 숨김

const state = {
  cells: new Map(),                    // "x,y" → {x, y, sh, rot, col}
  cam: { x: 0, y: 0, z: 1 },           // x,y = 화면 좌상단의 월드 좌표
  brush: { sh:"Q", rot:0, col:"g" },
  tool: "paint",                       // "paint" | "erase"
  hand: false,
  mirror: false,
  axis: 0,                             // 미러 축 위치, 반 칸 단위 (짝수 = 셀 경계, 홀수 = 셀 중앙)
  bgOn: true,
  showGrid: true,
  placing: null,                       // null | {name, cells:[{x,y,sh,rot,col}], cols, rows}
  selectMode: false,                   // 갤러리 업로드용 영역 선택 모드
  selRect: null,                       // {x0,y0,x1,y1} 셀 인덱스(포함)
  undo: [],
};

const key = (x, y) => `${x},${y}`;

/* ───────────────────────── 도형 마크업 ───────────────────────── */
function rotatable(sh){ return sh === "Q" || sh === "I"; }

function shapeMarkup(sh, rot, fill, s, mode = "screen"){
  // 이음매 방지 스트로크 — 화면에선 줌과 무관하게 항상 1px(non-scaling),
  // 내보내기/아이콘에선 셀의 0.75% 고정. 두께가 눈에 띄지 않으면서 틈만 덮는다.
  const seam = mode === "screen"
    ? ` stroke="${fill}" stroke-width="1" vector-effect="non-scaling-stroke"`
    : ` stroke="${fill}" stroke-width="${s/80}"`;
  if (sh === "S") return `<rect x="0" y="0" width="${s}" height="${s}" fill="${fill}"${seam}/>`;
  if (sh === "C") return `<circle cx="${s/2}" cy="${s/2}" r="${s/2}" fill="${fill}"${seam}/>`;
  const tf = rot ? ` transform="rotate(${rot*90} ${s/2} ${s/2})"` : "";
  if (sh === "Q"){
    // 좌상단 모서리에 중심을 둔 사분원 (볼록)
    return `<path d="M0,0 L${s},0 A${s},${s} 0 0,1 0,${s} Z" fill="${fill}"${seam}${tf}/>`;
  }
  if (sh === "I"){
    // 정사각형에서 좌상단 사분원을 뺀 모양 (오목)
    return `<path d="M${s},0 L${s},${s} L0,${s} A${s},${s} 0 0,0 ${s},0 Z" fill="${fill}"${seam}${tf}/>`;
  }
  return "";
}

function parsePresetCells(p){
  const cells = [];
  let cols = 0;
  p.data.forEach((row, y) => {
    const tokens = row.trim().split(/\s+/);
    cols = Math.max(cols, tokens.length);
    tokens.forEach((t, x) => {
      if (t === ".") return;
      cells.push({ x, y, sh: t[1], rot: Number(t[2]) || 0, col: t[0] });
    });
  });
  return { name: p.name, cells, cols, rows: p.data.length };
}

// 도장 90° 시계방향 회전: (x,y) → (rows-1-y, x), 회전값 +1
function rotateStamp(st){
  const cells = st.cells.map(c => ({
    x: st.rows - 1 - c.y,
    y: c.x,
    sh: c.sh,
    rot: rotatable(c.sh) ? (c.rot + 1) % 4 : 0,
    col: c.col,
  }));
  return { name: st.name, cells, cols: st.rows, rows: st.cols };
}

/* ───────────────────────── DOM ───────────────────────── */
const boardEl = document.getElementById("board");
const stageEl = document.getElementById("stage");
const zoomHud = document.getElementById("zoomHud");
const placebar = document.getElementById("placebar");

function boardRect(){ return boardEl.getBoundingClientRect(); }

/* ───────────────────────── 좌표 변환 ───────────────────────── */
function screenToWorld(sx, sy){
  const r = boardRect();
  return {
    x: state.cam.x + (sx - r.left) / state.cam.z,
    y: state.cam.y + (sy - r.top)  / state.cam.z,
  };
}
function cellFromPoint(cx, cy){
  const w = screenToWorld(cx, cy);
  return { x: Math.floor(w.x / CELL), y: Math.floor(w.y / CELL) };
}
function cellFromEvent(e){ return cellFromPoint(e.clientX, e.clientY); }
// 터치 배치 시 고스트가 손가락에 가려지지 않도록 위로 띄우는 화면 오프셋(px)
const TOUCH_PLACE_OFFSET = 48;

function visibleWorld(){
  const r = boardRect();
  return { x: state.cam.x, y: state.cam.y, w: r.width / state.cam.z, h: r.height / state.cam.z };
}

/* ───────────────────────── 렌더링 (rAF 코얼레싱) ───────────────────────── */
let renderQueued = false;
let hoverCell = null;   // 배치 모드 고스트 위치

function scheduleRender(){
  saveStateSoon();                       // 변경 사항을 곧 로컬에 저장 (디바운스)
  if (renderQueued) return;
  renderQueued = true;
  requestAnimationFrame(() => { renderQueued = false; render(); });
}

function stampAnchor(){
  if (!state.placing || !hoverCell) return null;
  return {
    x: hoverCell.x - Math.floor(state.placing.cols / 2),
    y: hoverCell.y - Math.floor(state.placing.rows / 2),
  };
}

function render(){
  const v = visibleWorld();
  const cellPx = state.cam.z * CELL;
  let s = "";

  // 가이드 격자 — 도형 아래 레이어. 색면 위를 가로지르지 않도록 먼저 그린다.
  if (state.showGrid && cellPx >= GRID_MIN_PX){
    let lines = "";
    const cx0 = Math.floor(v.x / CELL), cx1 = Math.ceil((v.x + v.w) / CELL);
    const cy0 = Math.floor(v.y / CELL), cy1 = Math.ceil((v.y + v.h) / CELL);
    for (let cx = cx0; cx <= cx1; cx++)
      lines += `<line x1="${cx*CELL}" y1="${v.y}" x2="${cx*CELL}" y2="${v.y+v.h}" vector-effect="non-scaling-stroke"/>`;
    for (let cy = cy0; cy <= cy1; cy++)
      lines += `<line x1="${v.x}" y1="${cy*CELL}" x2="${v.x+v.w}" y2="${cy*CELL}" vector-effect="non-scaling-stroke"/>`;
    s += `<g stroke="rgba(84,137,98,.20)" stroke-width="1" pointer-events="none">${lines}</g>`;
  }

  // 셀 도형 — 보이는 것만 (격자 위에 그려서 색면이 깨끗하게 덮이도록)
  const x0 = v.x - CELL, x1 = v.x + v.w + CELL;
  const y0 = v.y - CELL, y1 = v.y + v.h + CELL;
  for (const c of state.cells.values()){
    const wx = c.x * CELL, wy = c.y * CELL;
    if (wx > x1 || wx + CELL < x0 || wy > y1 || wy + CELL < y0) continue;
    s += `<g transform="translate(${wx},${wy})">${shapeMarkup(c.sh, c.rot, COLORS[c.col], CELL)}</g>`;
  }

  // 미러 기준선 + 드래그 핸들
  if (state.mirror){
    const AX = state.axis * CELL / 2;
    if (AX > v.x - CELL && AX < v.x + v.w + CELL){
      s += `<line x1="${AX}" y1="${v.y}" x2="${AX}" y2="${v.y+v.h}" stroke="${COLORS.p}" stroke-width="2"
            stroke-dasharray="7 7" vector-effect="non-scaling-stroke" pointer-events="none"/>`;
      s += `<circle cx="${AX}" cy="${v.y + v.h/2}" r="${10/state.cam.z}" fill="${COLORS.p}"
            stroke="#fff" stroke-width="${2/state.cam.z}" pointer-events="none"/>`;
    }
  }

  // 배치 모드 고스트 미리보기 (미러 모드면 반전 사본도 함께)
  const a = stampAnchor();
  if (a){
    let g = "";
    for (const c of state.placing.cells){
      g += `<g transform="translate(${(a.x + c.x) * CELL},${(a.y + c.y) * CELL})">${shapeMarkup(c.sh, c.rot, COLORS[c.col], CELL)}</g>`;
    }
    const bw = state.placing.cols * CELL, bh = state.placing.rows * CELL;
    s += `<g opacity="0.55" pointer-events="none">${g}</g>`;
    s += `<rect x="${a.x*CELL}" y="${a.y*CELL}" width="${bw}" height="${bh}" fill="none"
          stroke="${COLORS.g}" stroke-width="1.5" stroke-dasharray="6 5"
          vector-effect="non-scaling-stroke" pointer-events="none"/>`;
    if (state.mirror){
      let mg = "";
      for (const c of state.placing.cells){
        const gx = mirrorX(a.x + c.x);
        const rot = rotatable(c.sh) ? MIRROR_ROT[c.rot] : 0;
        mg += `<g transform="translate(${gx * CELL},${(a.y + c.y) * CELL})">${shapeMarkup(c.sh, rot, COLORS[c.col], CELL)}</g>`;
      }
      s += `<g opacity="0.35" pointer-events="none">${mg}</g>`;
    }
  }

  // 영역 선택 박스 (갤러리 업로드용)
  if (state.selectMode && state.selRect){
    const R = state.selRect;
    const rx = R.x0 * CELL, ry = R.y0 * CELL;
    const rw = (R.x1 - R.x0 + 1) * CELL, rh = (R.y1 - R.y0 + 1) * CELL;
    s += `<rect x="${rx}" y="${ry}" width="${rw}" height="${rh}" fill="${COLORS.g}" fill-opacity="0.12"
          stroke="${COLORS.g}" stroke-width="2" stroke-dasharray="8 5" vector-effect="non-scaling-stroke" pointer-events="none"/>`;
  }

  // 실시간 협업 커서 + 채팅 말풍선 (월드 좌표, 화면 크기 일정하도록 1/z)
  if (remoteCursors.size || chatBubbles.size || typingUsers.size){
    const k2 = 1 / state.cam.z;
    const nowMs = performance.now();
    for (const [uid, t] of typingUsers) if (t.until <= nowMs) typingUsers.delete(uid);   // 만료된 입력중 정리
    for (const [uid, arr] of chatBubbles){ const a = arr.filter(b => b.until > nowMs); if (a.length) chatBubbles.set(uid, a); else chatBubbles.delete(uid); }   // 만료된 말풍선 정리(uid당 배열)
    // 글자수 기반 폭 추정: 한글/CJK는 폰트 크기만큼, 라틴/숫자는 ~0.56배
    const WIDE = /[ᄀ-ᇿ⺀-꓏가-힣豈-﫿＀-￯]/;
    const textW = (str, f) => { let w = 0; for (const ch of (str || "")) w += WIDE.test(ch) ? f : f * 0.56; return w; };
    // 배경색 밝기에 따라 글자색 선택(노랑·분홍 같은 밝은 색엔 흰 글자가 안 보임)
    const inkOn = (hex) => { const h = hex.replace("#",""); const r=parseInt(h.slice(0,2),16),g=parseInt(h.slice(2,4),16),b=parseInt(h.slice(4,6),16); return (0.299*r + 0.587*g + 0.114*b) > 165 ? "#3d6249" : "#fff"; };
    // 커서 장식 크기: 배율(scale) 대신 실제 px로 지정 → 글자 또렷(줌 보정 k2만 적용). 여기서 따로 조절.
    const CH = 18, CR = CH / 2, CFONT = 10, CGAP = 6, BG = 4;   // 높이·모서리반지름·폰트·커서와의 간격
    // 말풍선 경로: 좌상단+우하단만 사분원(r=h/2), 나머지 직각(점대칭)
    const bubblePath = (w, h, r) => `M${r} 0 L${w} 0 L${w} ${h - r} A${r} ${r} 0 0 1 ${w - r} ${h} L0 ${h} L0 ${r} A${r} ${r} 0 0 1 ${r} 0 Z`;
    // 채팅 말풍선: 보낸이 색 채움·흰 글자. 커서 끝과 왼쪽 정렬·살짝 위. 등장 시 좌하단에서 팝.
    const bubble = (x, y, b, idx) => {
      const h = 26, r = 13, pad = 12, w = textW(b.text, 14) + pad * 2;   // 말풍선 한 번 더 1.2배 (높이26·폰트14)
      const e = b.start ? Math.min(1, (nowMs - b.start) / 340) : 1;                       // 0..1 등장 진행
      const sc = e < 0.62 ? (0.55 + 0.82 * e) : (1.06 - 0.06 * ((e - 0.62) / 0.38));      // .55→1.06→1 (살짝 오버슈트)
      const op = Math.min(1, e * 2.2);
      const offY = -(CGAP + h + idx * (h + BG));
      return `<g transform="translate(${x},${y}) scale(${k2})" pointer-events="none">`
        + `<g transform="translate(0,${offY})" opacity="${op.toFixed(2)}">`
        + `<g transform="translate(0,${h}) scale(${sc.toFixed(3)}) translate(0,${-h})">`
        + `<path d="${bubblePath(w, h, r)}" fill="${b.color}" stroke="#fff8ee" stroke-width="1.3"/>`
        + `<text x="${pad}" y="${(h/2 + 14*0.35).toFixed(1)}" font-size="14" font-weight="500" fill="#fff">${escapeHtml(b.text)}</text>`
        + `</g></g></g>`;
    };
    // 입력 중 표시: 점 3개가 위아래로 (시간 기반이라 보드 재렌더와 무관하게 부드러움)
    // 입력중 점: 투명도 깜빡임 + 살짝(-3px) 위로 (curBlink 스타일). 색은 흰색 유지. 0/80/100%→op.25·y0, 40%→op1·y-3
    const dotAnim = (i) => {
      const cyc = 1.1; const f = ((((nowMs/1000) - i*0.16) % cyc) + cyc) % cyc / cyc;
      if (f < 0.4){ const t = f/0.4; return { y: -3*t, op: 0.25 + 0.75*t }; }
      if (f < 0.8){ const t = (f-0.4)/0.4; return { y: -3*(1-t), op: 1 - 0.75*t }; }
      return { y: 0, op: 0.25 };
    };
    const typingBubble = (x, y, color, idx) => {
      const h = 26, r = 13, dr = 3.5, gap = 6, padX = 13, w = padX*2 + dr*2*3 + gap*2, cy0 = h/2 + 2;
      const offY = -(CGAP + h + (idx || 0) * (h + BG));
      let dots = "";
      for (let i = 0; i < 3; i++){ const a = dotAnim(i); dots += `<circle cx="${padX + dr + i*(dr*2+gap)}" cy="${(cy0 + a.y).toFixed(2)}" r="${dr}" fill="#fff" opacity="${a.op.toFixed(2)}"/>`; }
      return `<g transform="translate(${x},${y}) scale(${k2})" pointer-events="none"><g transform="translate(0,${offY})">`
        + `<path d="${bubblePath(w, h, r)}" fill="${color}" stroke="#fff8ee" stroke-width="1.3"/>${dots}</g></g>`;
    };
    // 이름표(잎) 커서: 우상단+좌하단만 사분원(r=높이/2), 좌상단·우하단은 직각(말풍선의 위아래 뒤집힌 점대칭).
    // 좌상단 직각 꼭짓점(0,0)이 실제 커서 위치를 가리킴, 몸체는 우하단으로.
    for (const cu of remoteCursors.values()){
      const nm = cu.name || "";
      const W = nm ? textW(nm, CFONT) + 16 : CH;    // 이름 폭 + 좌우 여백(각 8px)
      const d = `M0 0 L${W - CR} 0 A${CR} ${CR} 0 0 1 ${W} ${CR} L${W} ${CH} L${CR} ${CH} A${CR} ${CR} 0 0 1 0 ${CH - CR} Z`;
      s += `<g transform="translate(${cu.x},${cu.y}) scale(${k2})" pointer-events="none">`
        + `<path d="${d}" fill="${cu.color}" stroke="#fff8ee" stroke-width="1.3"/>`
        + (nm ? `<text x="${W/2}" y="${(CH/2 + CFONT*0.35).toFixed(1)}" font-size="${CFONT}" font-weight="700" fill="${inkOn(cu.color)}" text-anchor="middle">${escapeHtml(nm)}</text>` : "")
        + `</g>`;
      const ty = typingUsers.get(cu.uid), arr = chatBubbles.get(cu.uid);
      let base = 0;
      if (ty && ty.until > nowMs){ s += typingBubble(cu.x, cu.y, ty.color || cu.color, 0); base = 1; }   // 입력중이면 점점점이 맨 아래
      if (arr) for (let i = 0; i < arr.length; i++) s += bubble(cu.x, cu.y, arr[i], base + (arr.length - 1 - i));   // 최신=커서 가까이, 오래된 건 위로
    }
    const myArr = chatBubbles.get(myUid);   // 내 메시지도 내 커서 위에 쌓임
    if (myArr && myCursorW) for (let i = 0; i < myArr.length; i++) s += bubble(myCursorW.x, myCursorW.y, myArr[i], myArr.length - 1 - i);
  }

  boardEl.setAttribute("viewBox", `${v.x} ${v.y} ${v.w} ${v.h}`);
  boardEl.innerHTML = s;
  zoomHud.textContent = `${Math.round(state.cam.z * 100)}%`;
}

/* ───────────────────────── 실행취소 ───────────────────────── */
function pushUndo(){
  state.undo.push(JSON.stringify([...state.cells.values()]));
  if (state.undo.length > 50) state.undo.shift();
}
function undo(){
  const prev = state.undo.pop();
  if (prev === undefined) return;
  state.cells = new Map(JSON.parse(prev).map(c => [key(c.x, c.y), c]));
  if (rtChannel) roomSendSync();
  scheduleRender();
}

// {cells, cam, bgOn} 형태의 패턴을 상태에 적용 (로컬·온라인 공통)
function applyPattern(data){
  if (!data || !Array.isArray(data.cells)) return false;
  state.cells = new Map(
    data.cells
      .filter(c => c && Number.isFinite(c.x) && Number.isFinite(c.y) && c.sh && c.col)
      .map(c => [key(c.x, c.y), { x:c.x, y:c.y, sh:c.sh, rot:c.rot || 0, col:c.col }])
  );
  if (data.cam && Number.isFinite(data.cam.x) && Number.isFinite(data.cam.y) && Number.isFinite(data.cam.z)){
    state.cam.x = data.cam.x;
    state.cam.y = data.cam.y;
    state.cam.z = Math.min(ZMAX, Math.max(ZMIN, data.cam.z));
  }
  if (typeof data.bgOn === "boolean") state.bgOn = data.bgOn;
  return true;
}
function loadState(){
  try {
    const raw = localStorage.getItem(STORE_KEY);
    if (!raw) return false;
    return applyPattern(JSON.parse(raw));
  } catch (e) { return false; }
}

/* ───────────────────────── 셀 조작 ───────────────────────── */
function setCell(x, y, val){
  if (val) state.cells.set(key(x, y), { x, y, sh: val.sh, rot: val.rot || 0, col: val.col });
  else state.cells.delete(key(x, y));
}
function getCell(x, y){ return state.cells.get(key(x, y)) || null; }
function sameCell(c, brush){
  return !!c && c.sh === brush.sh && c.col === brush.col;
}
const mirrorX = (x) => state.axis - 1 - x;   // 미러 축 기준 반대편 셀 (축은 반 칸 단위)

function paintAt(x, y, initial){
  const mx = mirrorX(x);
  const changes = [];
  const apply = (val) => {
    setCell(x, y, val); changes.push({ x, y, val });
    if (state.mirror && mx !== x){
      const mval = val ? { ...val, rot: rotatable(val.sh) ? MIRROR_ROT[val.rot] : 0 } : null;
      setCell(mx, y, mval); changes.push({ x: mx, y, val: mval });
    }
  };

  if (state.tool === "erase"){
    apply(null);
  } else {
    const cur = getCell(x, y);
    if (initial && sameCell(cur, state.brush) && rotatable(cur.sh)){
      apply({ sh: cur.sh, col: cur.col, rot: (cur.rot + 1) % 4 });
    } else if (!sameCell(cur, state.brush) || (cur && cur.rot !== state.brush.rot)){
      apply({ ...state.brush, rot: rotatable(state.brush.sh) ? state.brush.rot : 0 });
    }
  }
  if (rtChannel && changes.length) roomSendPaint(changes);   // 실시간 협업 동기화
  scheduleRender();
}

/* ───────────────────────── 배치 모드 ───────────────────────── */
function setPlacing(parsed){
  if (parsed && state.selectMode) setSelectMode(false);
  state.placing = parsed;
  hoverCell = null;
  placebar.classList.toggle("visible", !!parsed);
  stageEl.classList.toggle("placingmode", !!parsed);
  if (parsed) document.getElementById("placeName").textContent = parsed.name;
  renderLibrary();
  renderShapes();   // 배치 모드일 땐 팔레트 선택 표시를 비움 (해제 시 복원)
  renderColors();
  scheduleRender();
}

function placeStampAt(anchor){
  if (!state.placing || !anchor) return;
  pushUndo();
  for (const c of state.placing.cells){
    setCell(anchor.x + c.x, anchor.y + c.y, { sh: c.sh, rot: c.rot, col: c.col });
  }
  if (state.mirror){
    for (const c of state.placing.cells){
      const gx = mirrorX(anchor.x + c.x);
      setCell(gx, anchor.y + c.y, {
        sh: c.sh,
        rot: rotatable(c.sh) ? MIRROR_ROT[c.rot] : 0,
        col: c.col,
      });
    }
  }
  if (rtChannel) roomSendSync();
  scheduleRender();
}

function rotatePlacing(){
  if (!state.placing) return;
  state.placing = rotateStamp(state.placing);
  scheduleRender();
}

document.getElementById("placeRotate").addEventListener("click", rotatePlacing);
document.getElementById("placeDone").addEventListener("click", () => setPlacing(null));

/* ───────────────────────── 카메라 (팬/줌) ───────────────────────── */
function panBy(dxPx, dyPx){
  state.cam.x -= dxPx / state.cam.z;
  state.cam.y -= dyPx / state.cam.z;
  scheduleRender();
}
function zoomAt(factor, sx, sy){
  const r = boardRect();
  const mx = sx - r.left, my = sy - r.top;
  const wx = state.cam.x + mx / state.cam.z;
  const wy = state.cam.y + my / state.cam.z;
  state.cam.z = Math.min(ZMAX, Math.max(ZMIN, state.cam.z * factor));
  state.cam.x = wx - mx / state.cam.z;
  state.cam.y = wy - my / state.cam.z;
  scheduleRender();
}
function zoomAtCenter(factor){
  const r = boardRect();
  zoomAt(factor, r.left + r.width / 2, r.top + r.height / 2);
}
function setZoomCentered(z){
  const r = boardRect();
  const cx = state.cam.x + r.width  / (2 * state.cam.z);
  const cy = state.cam.y + r.height / (2 * state.cam.z);
  state.cam.z = Math.min(ZMAX, Math.max(ZMIN, z));
  state.cam.x = cx - r.width  / (2 * state.cam.z);
  state.cam.y = cy - r.height / (2 * state.cam.z);
  scheduleRender();
}
function fitContent(){
  const r = boardRect();
  if (state.cells.size === 0){
    state.cam.z = 1;
    state.cam.x = -r.width  / 2;
    state.cam.y = -r.height / 2;
    scheduleRender();
    return;
  }
  let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
  for (const c of state.cells.values()){
    if (c.x < minX) minX = c.x;
    if (c.y < minY) minY = c.y;
    if (c.x > maxX) maxX = c.x;
    if (c.y > maxY) maxY = c.y;
  }
  const wx = (minX - 1) * CELL, wy = (minY - 1) * CELL;
  const ww = (maxX - minX + 3) * CELL, wh = (maxY - minY + 3) * CELL;
  const z = Math.min(ZMAX, Math.max(ZMIN, Math.min(r.width / ww, r.height / wh, 2.5)));
  state.cam.z = z;
  state.cam.x = wx + ww / 2 - r.width  / (2 * z);
  state.cam.y = wy + wh / 2 - r.height / (2 * z);
  scheduleRender();
}

/* ───────────────────────── 포인터 입력 ─────────────────────────
   1 포인터: 칠하기 / 배치 / 이동(손·Space·휠클릭) / 축 드래그
   2 포인터: 핀치 줌 + 이동 (모바일)                                  */
const pointers = new Map();
const deadPointers = new Set();
let painting = false;
let lastCell = null;
let panPointer = null;
let pinch = null;
let spaceDown = false;
let placeDragPointer = null;   // 터치 배치: 끌어서 놓기
let axisDragPointer = null;    // 미러 축 드래그
let selecting = false;         // 영역 선택 드래그 중
let selStart = null;           // 선택 시작 셀

function updateCursor(){
  stageEl.classList.toggle("panmode", (spaceDown || state.hand) && !panPointer);
  stageEl.classList.toggle("panning", panPointer !== null || pinch !== null);
}

// 미러 축에 포인터가 가까운지 (잡기 판정: 마우스 10px, 터치 18px)
function nearAxis(clientX, pointerType){
  if (!state.mirror) return false;
  const r = boardRect();
  const screenAX = (state.axis * CELL / 2 - state.cam.x) * state.cam.z + r.left;
  return Math.abs(clientX - screenAX) <= (pointerType === "mouse" ? 10 : 18);
}

boardEl.addEventListener("pointerdown", (e) => {
  e.preventDefault();
  if (chatTyping) endChatTyping();   // 캔버스 누르면 채팅 입력 닫기
  boardEl.setPointerCapture(e.pointerId);
  pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });

  // 두 번째 손가락 → 핀치 모드 (진행 중이던 칠하기/배치 끌기/축 드래그는 취소)
  if (pointers.size === 2){
    if (painting){ painting = false; lastCell = null; undo(); }
    placeDragPointer = null;
    axisDragPointer = null;
    panPointer = null;
    const [a, b] = [...pointers.values()];
    pinch = {
      dist: Math.hypot(a.x - b.x, a.y - b.y),
      mx: (a.x + b.x) / 2,
      my: (a.y + b.y) / 2,
      base: Math.hypot(a.x - b.x, a.y - b.y),  // 줌 데드존 기준 간격
      zooming: false,
    };
    for (const id of pointers.keys()) deadPointers.add(id);
    updateCursor();
    return;
  }
  if (pointers.size > 2) return;

  // 이동: 휠클릭(중버튼) / Space / 손 도구
  if (e.button === 1 || spaceDown || state.hand){
    panPointer = e.pointerId;
    updateCursor();
    return;
  }
  if (e.button !== 0) return;

  // 영역 선택 모드 (갤러리 업로드) — 칠하기 대신 박스 드래그
  if (state.selectMode){
    selecting = true;
    selStart = cellFromEvent(e);
    state.selRect = { x0: selStart.x, y0: selStart.y, x1: selStart.x, y1: selStart.y };
    scheduleRender();
    return;
  }

  // 미러 축 잡기 (배치·칠하기보다 우선)
  if (nearAxis(e.clientX, e.pointerType)){
    axisDragPointer = e.pointerId;
    stageEl.classList.add("axishover");
    return;
  }

  // 배치 모드: 마우스는 즉시 찍기, 터치/펜은 끌어서 놓기 (고스트는 손가락 위로 띄움)
  if (state.placing){
    if (e.pointerType === "mouse"){
      hoverCell = cellFromEvent(e);
      placeStampAt(stampAnchor());
    } else {
      hoverCell = cellFromPoint(e.clientX, e.clientY - TOUCH_PLACE_OFFSET);
      placeDragPointer = e.pointerId;
      scheduleRender();
    }
    return;
  }

  // 칠하기 시작
  painting = true;
  pushUndo();
  const { x, y } = cellFromEvent(e);
  lastCell = key(x, y);
  paintAt(x, y, true);
});

boardEl.addEventListener("pointermove", (e) => {
  const prev = pointers.get(e.pointerId);
  if (prev) pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (rtChannel) sendCursor(e.clientX, e.clientY);   // 협업 커서 위치 전송

  // 핀치 (두 손가락) — 간격 변화가 데드존(14px)을 넘기 전까지는 순수 이동
  if (pinch && pointers.size === 2){
    const [a, b] = [...pointers.values()];
    const dist = Math.hypot(a.x - b.x, a.y - b.y);
    const mx = (a.x + b.x) / 2, my = (a.y + b.y) / 2;
    if (!pinch.zooming && Math.abs(dist - pinch.base) > 14){
      pinch.zooming = true;
      pinch.dist = dist;               // 활성화 순간의 배율 점프 방지
    }
    if (pinch.zooming && pinch.dist > 0 && dist > 0) zoomAt(dist / pinch.dist, mx, my);
    panBy(mx - pinch.mx, my - pinch.my);
    pinch.dist = dist; pinch.mx = mx; pinch.my = my;
    return;
  }

  // 화면 이동
  if (panPointer === e.pointerId && prev){
    panBy(e.clientX - prev.x, e.clientY - prev.y);
    return;
  }

  // 미러 축 드래그 (반 칸 단위 스냅)
  if (axisDragPointer === e.pointerId){
    const w = screenToWorld(e.clientX, e.clientY);
    state.axis = Math.round(w.x / (CELL / 2));
    scheduleRender();
    return;
  }

  // 영역 선택 드래그 (격자 스냅)
  if (selecting){
    const c = cellFromEvent(e);
    state.selRect = {
      x0: Math.min(selStart.x, c.x), y0: Math.min(selStart.y, c.y),
      x1: Math.max(selStart.x, c.x), y1: Math.max(selStart.y, c.y),
    };
    updateSelbar();
    scheduleRender();
    return;
  }

  // 마우스 호버: 축 근처에서 좌우 이동 커서
  if (e.pointerType === "mouse" && e.buttons === 0){
    stageEl.classList.toggle("axishover", nearAxis(e.clientX, "mouse"));
  }

  if (deadPointers.has(e.pointerId)) return;

  // 배치 모드: 고스트 이동 (마우스 호버 / 터치 끌기 — 터치는 손가락 위로 띄움)
  if (state.placing){
    if (e.pointerType === "mouse" || placeDragPointer === e.pointerId){
      const c = e.pointerType === "mouse"
        ? cellFromEvent(e)
        : cellFromPoint(e.clientX, e.clientY - TOUCH_PLACE_OFFSET);
      if (!hoverCell || c.x !== hoverCell.x || c.y !== hoverCell.y){
        hoverCell = c;
        scheduleRender();
      }
    }
    return;
  }

  // 칠하기 드래그
  if (painting){
    const { x, y } = cellFromEvent(e);
    const k = key(x, y);
    if (k === lastCell) return;
    lastCell = k;
    paintAt(x, y, false);
  }
});

["pointerup", "pointercancel"].forEach(ev =>
  boardEl.addEventListener(ev, (e) => {
    // 영역 선택 드래그 끝 → 선택 확정
    if (selecting){ selecting = false; updateSelbar(); }
    // 터치 배치 끝 → 그 자리에 찍기
    if (ev === "pointerup" && placeDragPointer === e.pointerId){
      placeStampAt(stampAnchor());
    }
    if (placeDragPointer === e.pointerId) placeDragPointer = null;
    if (axisDragPointer === e.pointerId){
      axisDragPointer = null;
      stageEl.classList.remove("axishover");
    }

    pointers.delete(e.pointerId);
    deadPointers.delete(e.pointerId);
    if (panPointer === e.pointerId) panPointer = null;
    if (pointers.size < 2) pinch = null;
    if (pointers.size === 0){ painting = false; lastCell = null; }
    updateCursor();
  })
);

boardEl.addEventListener("pointerleave", () => {
  if (state.placing && !placeDragPointer){ hoverCell = null; scheduleRender(); }
});

// 휠 = 커서 기준 확대/축소 (트랙패드 핀치의 ctrl+wheel도 동일 처리)
stageEl.addEventListener("wheel", (e) => {
  e.preventDefault();
  const factor = Math.exp(-e.deltaY * (e.ctrlKey ? 0.01 : 0.0017));
  zoomAt(factor, e.clientX, e.clientY);
}, { passive:false });

// 중버튼 자동 스크롤 방지 + 우클릭: 배치 종료 / 컨텍스트 메뉴 차단
boardEl.addEventListener("auxclick", (e) => { if (e.button === 1) e.preventDefault(); });
boardEl.addEventListener("contextmenu", (e) => {

/* ───────────────────────── 키보드 ───────────────────────── */
document.addEventListener("keydown", (e) => {
  const tg = e.target;
  if (tg && (tg.tagName === "INPUT" || tg.tagName === "TEXTAREA" || tg.isContentEditable) && e.key !== "Escape") return;
  if (e.key === "Enter"){ if (roomConnected){ e.preventDefault(); focusChatInput(); } return; }   // 엔터 = 채팅 입력 열기(협업 중)
  if (e.code === "Space"){
    e.preventDefault();
    if (!e.repeat){ spaceDown = true; updateCursor(); }
    return;
  }
  if (e.key === "Escape"){
    if (loadDialog.classList.contains("open")){ closeLoadDialog(); return; }
    if (uploadDialog.classList.contains("open")){ uploadDialog.classList.remove("open"); pendingUploadCells = null; return; }
    if (galleryOverlay.classList.contains("open")){ closeGallery(); return; }
    if (state.selectMode){ setSelectMode(false); return; }
    if (state.placing) setPlacing(null);
    return;
  }
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "z"){ e.preventDefault(); undo(); }
  else if (e.key.toLowerCase() === "r" && !e.metaKey && !e.ctrlKey){
    if (state.placing) rotatePlacing();
    else if (rotatable(state.brush.sh)){ state.brush.rot = (state.brush.rot + 1) % 4; renderShapes(); }
  }
  else if (e.key.toLowerCase() === "g" && !e.metaKey && !e.ctrlKey){
    toggleGrid();
  }
});
document.addEventListener("keyup", (e) => {
  if (e.code === "Space"){ spaceDown = false; updateCursor(); }
});
window.addEventListener("blur", () => {
  spaceDown = false; panPointer = null; pinch = null; placeDragPointer = null; axisDragPointer = null; updateCursor();
});

/* ───────────────────────── 팔레트 ───────────────────────── */
const SHAPES = [
  { sh:"S", label:"정사각형" },
  { sh:"C", label:"원" },
  { sh:"Q", label:"사분원" },
  { sh:"I", label:"역사분원" },
  { sh:"E", label:"지우개" },
];

function paletteIcon(sh){
  const s = 30;
  if (sh === "E"){
    return `<svg width="${s}" height="${s}" viewBox="0 0 ${s} ${s}">
      <rect x="1.5" y="1.5" width="${s-3}" height="${s-3}" rx="4" fill="none"
            stroke="rgba(61,75,58,.4)" stroke-width="1.6" stroke-dasharray="4 4"/></svg>`;
  }
  const rot = rotatable(sh) ? state.brush.rot : 0;
  return `<svg width="${s}" height="${s}" viewBox="0 0 ${s} ${s}">${shapeMarkup(sh, rot, COLORS[state.brush.col], s, "export")}</svg>`;
}

/* ───────────────────────── 랜덤 / 지우기 / 실행취소 ───────────────────────── */
function randomCellVal(){
  const r = Math.random();
  if (r < 0.16) return null;
  const colKeys = ["p", "y", "g"];
  const col = colKeys[Math.floor(Math.random() * 3)];
  const r2 = Math.random();
  let sh;
  if      (r2 < 0.17) sh = "S";
  else if (r2 < 0.44) sh = "C";
  else if (r2 < 0.80) sh = "Q";
  else                sh = "I";
  return { sh, col, rot: rotatable(sh) ? Math.floor(Math.random() * 4) : 0 };
}

document.getElementById("randomBtn").addEventListener("click", () => {
  pushUndo();
  const v = visibleWorld();
  let cx0 = Math.floor(v.x / CELL), cx1 = Math.ceil((v.x + v.w) / CELL) - 1;
  let cy0 = Math.floor(v.y / CELL), cy1 = Math.ceil((v.y + v.h) / CELL) - 1;
  const MAXC = 64, MAXR = 36;
  if (cx1 - cx0 + 1 > MAXC){
    const mid = Math.round((cx0 + cx1) / 2);
    cx0 = mid - Math.floor(MAXC / 2); cx1 = cx0 + MAXC - 1;
  }
  if (cy1 - cy0 + 1 > MAXR){
    const mid = Math.round((cy0 + cy1) / 2);
    cy0 = mid - Math.floor(MAXR / 2); cy1 = cy0 + MAXR - 1;
  }

  const done = new Set();
  for (let y = cy0; y <= cy1; y++){
    for (let x = cx0; x <= cx1; x++){
      const cx = state.mirror ? Math.max(x, mirrorX(x)) : x;
      const k = key(cx, y);
      if (done.has(k)) continue;
      done.add(k);
      const val = randomCellVal();
      setCell(cx, y, val);
      if (state.mirror){
        const mx = mirrorX(cx);
        if (mx !== cx) setCell(mx, y, val ? { ...val, rot: rotatable(val.sh) ? MIRROR_ROT[val.rot] : 0 } : null);
      }
    }
  }
  if (rtChannel) roomSendSync();
  scheduleRender();
});

/* ───────────────────────── 내보내기 — 내용 경계 자동 크롭 ───────────────────────── */
function buildExportSVG(){
  if (state.cells.size === 0) return null;
  let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
  for (const c of state.cells.values()){
    if (c.x < minX) minX = c.x;
    if (c.y < minY) minY = c.y;
    if (c.x > maxX) maxX = c.x;
    if (c.y > maxY) maxY = c.y;
  }
  const cols = maxX - minX + 1, rows = maxY - minY + 1;
  const W = cols * CELL, H = rows * CELL;
  let s = `<svg xmlns="http://www.w3.org/2000/svg" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}">`;
  if (state.bgOn) s += `<rect x="0" y="0" width="${W}" height="${H}" fill="${BG}"/>`;
  for (const c of state.cells.values()){
    s += `<g transform="translate(${(c.x - minX) * CELL},${(c.y - minY) * CELL})">${shapeMarkup(c.sh, c.rot, COLORS[c.col], CELL, "export")}</g>`;
  }
  s += `</svg>`;
  return { svg: s, cols, rows };
}

function downloadBlob(blob, filename){
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = filename;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

document.getElementById("svgBtn").addEventListener("click", () => {
  const out = buildExportSVG();
  if (!out){ alert("캔버스가 비어 있어요."); return; }
  downloadBlob(new Blob([out.svg], { type: "image/svg+xml" }), "janflower-pattern.svg");
});

document.getElementById("pngBtn").addEventListener("click", () => {
  const out = buildExportSVG();
  if (!out){ alert("캔버스가 비어 있어요."); return; }
  const blob = new Blob([out.svg], { type: "image/svg+xml" });
  const url = URL.createObjectURL(blob);
  const img = new Image();
  img.onload = () => {
    const base = Math.max(out.cols, out.rows) * CELL;
    const scale = Math.max(1, Math.min(3, Math.floor(8000 / base)));
    const canvas = document.createElement("canvas");
    canvas.width = out.cols * CELL * scale;
    canvas.height = out.rows * CELL * scale;
    const ctx = canvas.getContext("2d");
    ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
    URL.revokeObjectURL(url);
    canvas.toBlob(b => downloadBlob(b, "janflower-pattern.png"), "image/png");
  };
  img.src = url;
});

// 셀 배열 → 썸네일 SVG
function cellsThumb(cells){
  if (!cells || !cells.length) return "";
  let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
  for (const c of cells){ if (c.x<minX)minX=c.x; if (c.y<minY)minY=c.y; if (c.x>maxX)maxX=c.x; if (c.y>maxY)maxY=c.y; }
  const cols = maxX-minX+1, rows = maxY-minY+1, S = 30;
  const side = Math.max(cols, rows) * S;                       // 정사각 캔버스 (모든 썸네일 동일 크기)
  const offX = (side - cols*S) / 2, offY = (side - rows*S) / 2; // 패턴을 가운데 정렬
  let s = `<svg viewBox="0 0 ${side} ${side}" xmlns="http://www.w3.org/2000/svg">`;
  for (const c of cells){
    s += `<g transform="translate(${offX + (c.x-minX)*S},${offY + (c.y-minY)*S})">${shapeMarkup(c.sh, c.rot, COLORS[c.col], S, "export")}</g>`;
  }
  return s + `</svg>`;
}

/* ───────────────────────── 실시간 협업 (Supabase Realtime, SDK 지연로드) ───────────────────────── */
let rtClient = null, rtChannel = null, roomId = null;
let myUid = null, myName = null, myColor = null;
let roomConnected = false, myCursorW = null, presentCount = 0;
const remoteCursors = new Map();   // uid -> {uid,name,color,x,y}  (커서는 broadcast로 받음)
const chatBubbles = new Map();     // uid -> bubble[] {text,color,start,until}  (커서 위 말풍선, 쿨타임 안 끝난 건 위로 쌓임)
const typingUsers = new Map();     // uid -> {color,until}  (입력중 점점점 표시)
let fxRAF = null;                  // 말풍선 팝·입력중 점 애니메이션용 rAF 루프
let cursorThrottle = 0, roomSnapTimer = null;
const ROOM_NAMES = ["분홍","노랑","초록","튤립","데이지","민들레","코스모스","해바라기","새싹","바람개비"];
const ROOM_COLORS = ["#ff92ce","#ffcc66","#548962","#7b6cf6","#ff7a59","#2bb3a3","#e0479e","#5b8def"];

function inRoom(){ return !!rtChannel; }
function loadRealtimeSDK(){
  return new Promise((resolve, reject) => {
    if (window.supabase && window.supabase.createClient) return resolve();
    const sc = document.createElement("script");
    sc.src = "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2";
    sc.onload = resolve; sc.onerror = () => reject(new Error("sdk"));
    document.head.appendChild(sc);
  });
}

async function saveRoomSnapshot(){
  if (!roomId) return;
  try {
    await fetch(`${SB_URL}/rest/v1/janflower_rooms?on_conflict=id`, {
      method: "POST", headers: { ...SB_HEADERS, "Prefer": "resolution=merge-duplicates" },
      body: JSON.stringify({ id: roomId, data: { cells: [...state.cells.values()], bgOn: state.bgOn }, updated_at: new Date().toISOString() }),
    });
  } catch (e) {}
}
function saveRoomSnapshotSoon(){ if (!roomId) return; clearTimeout(roomSnapTimer); roomSnapTimer = setTimeout(saveRoomSnapshot, 1200); }

function roomSendPaint(changes){
  if (!rtChannel || !changes.length) return;
  rtChannel.send({ type:"broadcast", event:"paint", payload:{ changes } });
  saveRoomSnapshotSoon();
}
function roomSendSync(){
  if (!rtChannel) return;
  rtChannel.send({ type:"broadcast", event:"sync", payload:{ cells:[...state.cells.values()], bgOn: state.bgOn } });
  saveRoomSnapshotSoon();
}
function applyRemotePaint(changes){ for (const ch of changes) setCell(ch.x, ch.y, ch.val); scheduleRender(); }
function applyRemoteSync(cells, bgOn){
  state.cells = new Map((cells||[]).filter(c=>c&&Number.isFinite(c.x)&&Number.isFinite(c.y)&&c.sh&&c.col)
    .map(c=>[key(c.x,c.y),{x:c.x,y:c.y,sh:c.sh,rot:c.rot||0,col:c.col}]));
  if (typeof bgOn==="boolean"){ state.bgOn=bgOn; syncBgDom(); }
  scheduleRender();
}

function syncPresence(){           // presence = 누가 접속해 있나 (인원수 + 나간 사람 커서 정리)
  if (!rtChannel) return;
  const ps = rtChannel.presenceState();
  const present = new Set();
  for (const k in ps){ const m = ps[k][0]; if (m && m.uid && m.uid !== myUid) present.add(m.uid); }
  presentCount = present.size;
  for (const uid of [...remoteCursors.keys()]) if (!present.has(uid)) remoteCursors.delete(uid);
  updateRoomBar();
  scheduleRender();
}
function onRemoteCursor(p){         // 커서 위치는 broadcast로 (presence 한도 회피)
  if (!p || p.uid === myUid) return;
  remoteCursors.set(p.uid, { uid:p.uid, name:p.name, color:p.color, x:p.x, y:p.y });
  scheduleRender();
}
function sendCursor(clientX, clientY){
  if (!rtChannel) return;
  myCursorW = screenToWorld(clientX, clientY);   // 내 위치(말풍선용) 항상 갱신
  const now = performance.now();
  const mb = chatBubbles.get(myUid);
  if (mb && mb.some(b => b.until > now)) scheduleRender();      // 내 말풍선이 내 커서를 따라오게 재렌더
  if (now - cursorThrottle < 60) return;          // ~16/s, broadcast (presence rate limit 회피)
  cursorThrottle = now;
  rtChannel.send({ type:"broadcast", event:"cursor", payload:{ uid: myUid, name: myName, color: myColor, x: Math.round(myCursorW.x), y: Math.round(myCursorW.y) } });
}

/* 내 커서(잎) — 솔로·협업 모두 보드 위 OS 커서를 숨기고 작은 잎이 마우스를 따라감(데스크탑만).
   색: 협업 중엔 내 방 색, 솔로일 땐 선택한 팔레트 색(기본 초록). 테두리는 배경(베이지)색이라 꽃 위에선 잎이 또렷이 분리돼 보임. */
const SOLO_LEAF = "#548962";   // 팔레트 색을 못 읽을 때의 기본값
let myLeafColor = "";
// 내 커서(잎)를 PNG로 구워 실제 CSS 커서로 지정 → OS가 그려서 픽셀스냅·떨림 없음·테두리 깔끔.
// 색: 협업 중엔 방 색, 솔로일 땐 선택 팔레트 색(기본 초록). 테두리=배경(베이지)색.
function showMyLeaf(){
  if (typeof document === "undefined" || !boardEl) return;
  const color = roomConnected ? myColor : (COLORS[state.brush.col] || SOLO_LEAF);
  if (color === myLeafColor) return;     // 색 안 바뀌면 재생성 안 함
  myLeafColor = color;
  const S = 18, pad = 2, total = S + pad * 2, LR = S / 2, scale = 2;   // 잎 18px + 테두리 여백, 2x로 또렷
  const cv = document.createElement("canvas");
  cv.width = total * scale; cv.height = total * scale;
  const ctx = cv.getContext("2d");
  ctx.scale(scale, scale); ctx.translate(pad, pad);
  const path = new Path2D(`M0 0 L${S - LR} 0 A${LR} ${LR} 0 0 1 ${S} ${LR} L${S} ${S} L${LR} ${S} A${LR} ${LR} 0 0 1 0 ${S - LR} Z`);
  ctx.fillStyle = color; ctx.fill(path);
  ctx.lineWidth = 1.3; ctx.lineJoin = "round"; ctx.strokeStyle = "#fff8ee"; ctx.stroke(path);
  const url = cv.toDataURL("image/png");
  const set = (v) => { boardEl.style.cursor = ""; boardEl.style.cursor = v; return !!boardEl.style.cursor; };
  set(`image-set(url("${url}") ${scale}x) ${pad} ${pad}, auto`)
    || set(`-webkit-image-set(url("${url}") ${scale}x) ${pad} ${pad}, auto`)
    || set(`url("${url}") ${pad} ${pad}, auto`);
}

function updateRoomBar(){
  const bar = document.getElementById("roombar");
  if (!bar) return;
  bar.classList.toggle("visible", inRoom());
  document.body.classList.toggle("inroom", inRoom());   // 협업 중 라이브러리 높이 줄여 채팅 공간 확보
  if (!inRoom()) return;
  document.getElementById("roomName").textContent = myName || "나";
  document.getElementById("roomDot").style.background = myColor || "var(--green)";
  document.getElementById("roomCount").textContent = roomConnected ? `${presentCount + 1}명` : "연결 중…";
}

/* 채팅창: 평소 숨김. 좌하단 호버 또는 엔터로 표시(엔터는 입력 포커스까지).
   채팅 기록 박스 없이 말풍선이 세로로 연속. */
// 표시 조건 = 협업 중 && (입력 중 || 좌하단 호버). 상태에서 매번 다시 계산해 견고하게.
let chatTyping = false, chatHover = false, chatFlash = false, chatFlashTimer = null;
function updateChatVis(){ document.getElementById("chatbox").classList.toggle("visible", roomConnected && (chatTyping || chatHover || chatFlash)); }
function flashChat(){ chatFlash = true; updateChatVis(); clearTimeout(chatFlashTimer); chatFlashTimer = setTimeout(() => { chatFlash = false; updateChatVis(); }, 4500); }  // 새 메시지 오면 잠깐 표시
function initChat(){ document.getElementById("chatLog").innerHTML = ""; chatTyping = chatHover = chatFlash = false; if (myColor) document.getElementById("chatInput").style.background = myColor; updateChatVis(); }
function forceCloseChat(){ chatTyping = chatHover = chatFlash = false; clearTimeout(chatFlashTimer); document.getElementById("chatLog").innerHTML = ""; updateChatVis(); }
function focusChatInput(){ if (!roomConnected) return; chatTyping = true; updateChatVis(); document.getElementById("chatInput").focus(); }
function endChatTyping(){ chatTyping = false; document.getElementById("chatInput").blur(); updateChatVis(); }
function appendChat(name, color, text){
  const log = document.getElementById("chatLog"); if (!log) return;
  const d = document.createElement("div"); d.className = "chat-msg jf-in"; d.style.background = color;
  d.innerHTML = `<span class="who">${escapeHtml(name)}</span><span>${escapeHtml(text)}</span>`;
  log.appendChild(d);
  setTimeout(() => d.classList.remove("jf-in"), 360);   // 슬라이드 등장 후 클래스 제거(재오픈 시 재생 방지)
  while (log.children.length > 40) log.removeChild(log.firstChild);
  log.scrollTop = log.scrollHeight;
  flashChat();   // 새 메시지(보내거나 받거나) 오면 채팅창 잠깐 띄움
}
/* 말풍선 팝·입력중 점 애니메이션: 활성 동안만 rAF로 재렌더(보드 재렌더와 무관하게 부드럽게) */
function fxActive(){
  const now = performance.now();
  for (const t of typingUsers.values()) if (t.until > now) return true;
  for (const arr of chatBubbles.values()) for (const b of arr) if (b.until > now && now - b.start < 380) return true;
  return false;
}
function startFx(){ if (fxRAF) return; const tick = () => { render(); fxRAF = fxActive() ? requestAnimationFrame(tick) : null; }; fxRAF = requestAnimationFrame(tick); }
function onTyping(p){
  if (!p || p.uid === myUid) return;
  if (p.on) typingUsers.set(p.uid, { color: p.color, until: performance.now() + 3500 });
  else typingUsers.delete(p.uid);
  startFx(); scheduleRender();
}
/* 내가 입력 중임을 알림(점점점). 입력 이벤트마다 핑(스로틀), 멈추면 끔. */
let typingSentAt = 0, typingStopTimer = null;
function pingTyping(){
  if (!rtChannel || !roomConnected) return;
  const now = performance.now();
  if (now - typingSentAt > 1200){ rtChannel.send({ type:"broadcast", event:"typing", payload:{ uid: myUid, color: myColor, on:true } }); typingSentAt = now; }
  clearTimeout(typingStopTimer); typingStopTimer = setTimeout(stopTyping, 2600);
}
function stopTyping(){ clearTimeout(typingStopTimer); if (!typingSentAt) return; typingSentAt = 0; if (rtChannel) rtChannel.send({ type:"broadcast", event:"typing", payload:{ uid: myUid, on:false } }); }
function showChatBubble(uid, text, color){
  const b = { text: text.length > 24 ? text.slice(0, 24) + "…" : text, color, start: performance.now(), until: performance.now() + 4500 };
  const arr = chatBubbles.get(uid) || [];
  arr.push(b);                     // 새 말풍선을 스택에 추가(최신이 커서에 가장 가까움)
  while (arr.length > 5) arr.shift();   // 최대 5개, 넘으면 오래된 것부터 사라짐
  chatBubbles.set(uid, arr);
  startFx();                       // 등장 팝 애니메이션 루프 시작
  scheduleRender();
  setTimeout(scheduleRender, 4700);
}
function onChat(p){
  appendChat(p.name, p.color, p.text);
  if (p.uid) showChatBubble(p.uid, p.text, p.color);
}
function sendChat(){
  const inp = document.getElementById("chatInput");
  const text = inp.value.trim();
  if (!text || !rtChannel) return;
  rtChannel.send({ type:"broadcast", event:"chat", payload:{ uid: myUid, name: myName, color: myColor, text } });
  appendChat(myName, myColor, text);        // self:false라 내 메시지는 직접 표시
  showChatBubble(myUid, text, myColor);     // 내 커서 위에도 말풍선
  inp.value = "";
  stopTyping();                             // 전송했으니 입력중 표시 끔
}
(function(){
  // 한글 IME 안전: 조합 중 Enter는 전송 보류 → 조합 확정(compositionend) 후 한 번만 전송
  const ci = document.getElementById("chatInput");
  let composing = false, pendingSend = false;
  ci.addEventListener("compositionstart", () => { composing = true; });
  ci.addEventListener("compositionend", () => {
    composing = false;
    if (pendingSend){ pendingSend = false; sendChat(); }
  });
  ci.addEventListener("keydown", (e) => {
    if (e.key === "Escape"){ e.stopPropagation(); endChatTyping(); return; }   // Esc로 입력 닫기
    if (e.key !== "Enter") return;
    e.preventDefault();
    if (composing || e.isComposing || e.keyCode === 229) pendingSend = true;  // 조합 끝나면 전송
    else sendChat();
  });
  ci.addEventListener("input", pingTyping);   // 타이핑하면 입력중 알림(점점점)
  ci.addEventListener("focus", () => { chatTyping = true; updateChatVis(); });
  ci.addEventListener("blur", () => { chatTyping = false; stopTyping(); updateChatVis(); });
})();
// 좌하단 모서리에 호버하면 채팅 표시(입력 중엔 항상 표시). 협업 방에서만.
document.addEventListener("mousemove", (e) => {
  if (!roomConnected) return;
  chatHover = e.clientX < 250 && e.clientY > window.innerHeight - 300;
  updateChatVis();
});

async function enterRoom(id, seed){
  setSelectMode(false); setPlacing(null); closeGallery();
  roomConnected = false; chatBubbles.clear(); myCursorW = null;
  toast("같이 그리기 방 연결 중…", 9000);
  try { await loadRealtimeSDK(); } catch (e){ toast("실시간 연결 실패 — 인터넷을 확인해 주세요", 3200); return; }
  roomId = id;
  myUid = Math.random().toString(36).slice(2, 9);
  myName = (localStorage.getItem("jf_nick") || "").trim() || ROOM_NAMES[Math.floor(Math.random()*ROOM_NAMES.length)];
  myColor = ROOM_COLORS[Math.floor(Math.random()*ROOM_COLORS.length)];
  const u = new URL(location.href); u.searchParams.set("room", id); u.searchParams.delete("p"); history.replaceState(null, "", u);

  let hadSnap = false;
  try {
    const res = await fetch(`${SB_URL}/rest/v1/janflower_rooms?id=eq.${encodeURIComponent(id)}&select=data&limit=1`, { headers: SB_HEADERS });
    const rows = res.ok ? await res.json() : [];
    if (rows.length && rows[0].data && Array.isArray(rows[0].data.cells)){ applyPattern(rows[0].data); hadSnap = true; }
  } catch (e) {}
  if (!hadSnap){ if (!seed) state.cells.clear(); await saveRoomSnapshot(); }
  allowSave = false;   // 협업 중엔 개인 저장 잠금 (나갈 때 결과를 내 캔버스로)

  rtClient = window.supabase.createClient(SB_URL, SB_KEY, { realtime: { params: { eventsPerSecond: 40 } } });
  rtChannel = rtClient.channel("jf-room-" + id, { config: { broadcast: { self:false }, presence: { key: myUid } } });
  rtChannel
    .on("broadcast", { event:"paint" }, ({ payload }) => applyRemotePaint(payload.changes || []))
    .on("broadcast", { event:"sync" }, ({ payload }) => applyRemoteSync(payload.cells, payload.bgOn))
    .on("broadcast", { event:"chat" }, ({ payload }) => onChat(payload))
    .on("broadcast", { event:"cursor" }, ({ payload }) => onRemoteCursor(payload))
    .on("broadcast", { event:"typing" }, ({ payload }) => onTyping(payload))
    .on("presence", { event:"sync" }, syncPresence)
    .subscribe(async (status) => {
      if (status === "SUBSCRIBED"){
        roomConnected = true;
        await rtChannel.track({ uid: myUid, name: myName, color: myColor });
        showMyLeaf();                       // 내 커서를 잎으로 (보드 OS 커서 숨김)
        initChat(); updateRoomBar();        // 채팅 준비(평소 숨김·호버/엔터로 표시)
        toast(seed ? "방을 만들었어요! '링크 복사'를 친구에게 보내면 같이 그릴 수 있어요"
                   : "방에 들어왔어요 — 같이 그려봐요!", 5000);
        fitContent();
      } else if (status === "CHANNEL_ERROR" || status === "TIMED_OUT" || status === "CLOSED"){
        roomConnected = false; showMyLeaf(); updateRoomBar();   // 잎을 솔로 색으로
        toast("실시간 연결이 불안정해요 — 새로고침하거나 잠시 후 다시 시도하세요", 4200);
      }
    });
  updateRoomBar();
  scheduleRender();
}
function createRoom(){
  if (IS_TOUCH){ toast("‘같이 그리기’는 지금 데스크톱에서만 돼요 (모바일은 준비 중이에요)", 3800); return; }
  enterRoom(Math.random().toString(36).slice(2, 8), true);
}
function leaveRoom(){
  if (rtChannel){ try { rtChannel.unsubscribe(); } catch(e){} rtChannel = null; }
  if (rtClient){ try { rtClient.removeAllChannels(); } catch(e){} rtClient = null; }
  roomId = null; roomConnected = false; remoteCursors.clear(); chatBubbles.clear(); typingUsers.clear(); stopTyping(); forceCloseChat(); showMyLeaf();   // 잎을 솔로 색(초록)으로 되돌림
  const u = new URL(location.href); u.searchParams.delete("room"); history.replaceState(null, "", u);
  allowSave = true; saveStateSoon();
  updateRoomBar(); scheduleRender();
  toast("방에서 나왔어요 — 그린 건 내 캔버스에 남아요");
}

document.getElementById("roomBtn").addEventListener("click", createRoom);
document.getElementById("roomLeave").addEventListener("click", leaveRoom);
document.getElementById("roomCopy").addEventListener("click", async () => {

document.getElementById("roomMe").addEventListener("click", () => {

});

/* ───────────── 녹화용 자동 시연 (인스타 릴스). ?demo=1 로 진입. 하단독만 사용 ───────────── */
function runDemo(){
  allowSave = false;                              // 데모 중엔 로컬 저장 끔 (사용자 저장본 보호)
  document.body.classList.add("demomode");
  const css = document.createElement("style");
  css.textContent =
    ".demomode #libFab,.demomode #gridFab,.demomode #fab,.demomode #zoomHud,.demomode #mtop,.demomode #mtoolbar,.demomode #roombar,.demomode #placebar{display:none!important;}"
    + ".demomode #board{cursor:none!important;}"
    + "#demoCursor{position:fixed;left:0;top:0;z-index:99999;pointer-events:none;transition:transform .28s cubic-bezier(.4,0,.2,1);will-change:transform;}"
    + "#demoCursor .dc-in{transition:transform .14s ease;transform-origin:4px 3px;}"
    + "#demoCursor.clk .dc-in{transform:scale(.58);}";
  document.head.appendChild(css);

  const cur = document.createElement("div");
  cur.id = "demoCursor";
  cur.innerHTML = "<div class='dc-in'><svg width='26' height='30' viewBox='0 0 26 30'><path d='M3 2 L3 23 L9 18 L13 27 L17 25 L13 16 L21 16 Z' fill='#2b2b2b' stroke='#fff8ee' stroke-width='1.7' stroke-linejoin='round'/></svg></div>";
  document.body.appendChild(cur);

  const sleep = ms => new Promise(r => setTimeout(r, ms));
  const GLIDE = 320, DOCK_HOLD = 150, PAINT_HOLD = 90;
  cur.style.transform = `translate(${innerWidth/2}px,${innerHeight/2}px)`;
  async function glide(x, y){ cur.style.transform = `translate(${x}px,${y}px)`; await sleep(GLIDE); }
  function pulse(){ cur.classList.add("clk"); setTimeout(() => cur.classList.remove("clk"), 150); }

  const SHAPE_IDX = { S:0, C:1, Q:2, I:3, E:4 }, COL_IDX = { p:0, y:1, g:2 };
  async function selShape(sh){
    const b = document.querySelectorAll("#dShapes .shape-btn")[SHAPE_IDX[sh]]; if (!b) return;
    const r = b.getBoundingClientRect();
    await glide(r.left + r.width/2, r.top + r.height/2); pulse();
    state.tool = "paint"; state.brush.sh = sh; if (!rotatable(sh)) state.brush.rot = 0;
    renderShapes(); await sleep(DOCK_HOLD);
  }
  async function selColor(col){
    const b = document.querySelectorAll("#dColors .swatch")[COL_IDX[col]]; if (!b) return;
    const r = b.getBoundingClientRect();
    await glide(r.left + r.width/2, r.top + r.height/2); pulse();
    state.brush.col = col; renderColors(); renderShapes(); await sleep(DOCK_HOLD);
  }
  async function paintCell(x, y, rot){
    const r = boardEl.getBoundingClientRect(), z = state.cam.z;
    await glide((x*CELL + CELL/2 - state.cam.x)*z + r.left, (y*CELL + CELL/2 - state.cam.y)*z + r.top);
    pulse(); setCell(x, y, { sh: state.brush.sh, rot, col: state.brush.col });
    scheduleRender(); await sleep(PAINT_HOLD);
  }
  function centerCam(z){ const r = boardEl.getBoundingClientRect(); state.cam.z = z; state.cam.x = 180 - r.width/(2*z); state.cam.y = 120 - r.height/(2*z); }
  function tweenCam(tz, dur){
    const r = boardEl.getBoundingClientRect();
    const sz = state.cam.z, sx0 = state.cam.x, sy0 = state.cam.y;
    const tx = 180 - r.width/(2*tz), ty = 120 - r.height/(2*tz), t0 = performance.now();
    return new Promise(res => { function f(now){ const p = Math.min(1, (now-t0)/dur), e = p<.5 ? 2*p*p : 1-Math.pow(-2*p+2,2)/2;
      state.cam.z = sz+(tz-sz)*e; state.cam.x = sx0+(tx-sx0)*e; state.cam.y = sy0+(ty-sy0)*e; scheduleRender();
      if (p<1) requestAnimationFrame(f); else res(); } requestAnimationFrame(f); });
  }

  // 하단독 기본 도형(Q 사분원·C 원·S 정사각)+색만으로 튤립 1 + 들꽃 1
  const GROUPS = [
    { sh:"Q", col:"p", cells:[[0,0,3],[1,0,2],[0,1,3],[1,1,2],[0,2,1],[1,2,0]] },
    { sh:"Q", col:"g", cells:[[0,3,1],[1,3,0],[3,3,2],[5,3,3]] },
    { sh:"C", col:"p", cells:[[4,0,0],[3,1,0],[5,1,0],[4,2,0]] },
    { sh:"C", col:"y", cells:[[4,1,0]] },
    { sh:"S", col:"g", cells:[[4,3,0]] },
  ];
  async function loop(){
    while (true){
      state.cells.clear(); state.bgOn = true; centerCam(1.5); scheduleRender();
      await glide(innerWidth/2, innerHeight*0.55); await sleep(550);
      for (const g of GROUPS){
        await selShape(g.sh); await selColor(g.col);
        for (const c of g.cells) await paintCell(c[0], c[1], c[2]);
      }
      await sleep(550); await tweenCam(0.9, 1100); await sleep(2200);   // 줌아웃 공개 후 잠시
    }
  }
  loop();
}

(function init(){
  const params = new URLSearchParams(location.search);
  if (params.get("demo")){ runDemo(); return; }   // 녹화용 자동 시연 (하단독으로 그리기)
  if (!IS_TOUCH) showMyLeaf();   // 로드 시 솔로 잎 커서 적용(협업 입장하면 방 색으로 갱신)
  if (params.get("room")){                                                   // 협업 방 링크
    if (IS_TOUCH){ toast("협업은 지금 데스크톱에서만 돼요 (모바일은 준비 중이에요)", 4200); }   // 모바일은 안내만 하고 일반 로드로
    else { enterRoom(params.get("room"), false); return; }
  }
  const sharedId = params.get("p");
  const syncBg = () => {
    stageEl.classList.toggle("transparent", !state.bgOn);
    bgBtn.classList.toggle("on", !state.bgOn);
  };
  const placeGarden = () => {
    const garden = parsedPresets.find(p => p.name === "꽃밭");
    for (const c of garden.cells) setCell(c.x - 4, c.y - 3, c);
  };

  // 첫 방문/콜드리셋: 꽃밭을 중앙에. 뷰포트 폭이 확정될 때까지(첫 터치 전) 다시 맞춘다.
  let framed = false;
  function frameGarden(){
    if (framed) return;
    const r = boardRect();
    if (!r.width || !r.height) return;
    let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
    for (const c of state.cells.values()){
      if (c.x < minX) minX = c.x;
      if (c.y < minY) minY = c.y;
      if (c.x > maxX) maxX = c.x;
      if (c.y > maxY) maxY = c.y;
    }
    const z = r.width <= 760 ? 0.4 : 1;   // 모바일(≤760)은 40% — 꽃밭이 모바일 화면보다 넓음
    state.cam.z = z;
    state.cam.x = (minX + maxX + 1) / 2 * CELL - r.width  / (2 * z);
    state.cam.y = (minY + maxY + 1) / 2 * CELL - r.height / (2 * z);
    scheduleRender();
  }
  function startGarden(){
    placeGarden();
    syncBg();
    boardEl.addEventListener("pointerdown", () => { framed = true; }, { once: true });
    window.addEventListener("resize", frameGarden);
    if (typeof ResizeObserver !== "undefined") new ResizeObserver(frameGarden).observe(stageEl);
    requestAnimationFrame(frameGarden);
    [0, 80, 250, 600].forEach(t => setTimeout(frameGarden, t));
  }
  const fitSoon = () => { fitContent(); [80, 250, 600].forEach(t => setTimeout(fitContent, t)); };

  // 공유 링크: 온라인에서 불러오기 (열람 중엔 저장 잠금 → 그리기 시작하면 내 작업으로 저장)
  if (sharedId){
    allowSave = false;
    boardEl.addEventListener("pointerdown", () => { allowSave = true; }, { once: true });
    loadSharedPattern(sharedId).then(ok => {
      if (ok){
        syncBg(); fitSoon();
        toast("공유된 패턴이에요 · 그리면 내 것으로 저장돼요", 3800);
      } else {
        toast("공유한 패턴을 찾지 못했어요");
        allowSave = true;
        if (loadState()){ syncBg(); scheduleRender(); } else startGarden();
      }
    }).catch(() => {
      toast("불러오기 실패 — 인터넷 연결을 확인해 주세요", 3600);
      allowSave = true;
      if (loadState()){ syncBg(); scheduleRender(); } else startGarden();
    });
    return;
  }

  // 일반: 저장본 복원 / 꽃밭
  const restored = loadState();
  syncBg();
  if (restored){ scheduleRender(); return; }
  startGarden();
})();
</script>
</body>
</html>
